<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our teams — Α6 Α7 Α8</title><style>
:root{font-family:Arial,"Helvetica Neue",sans-serif;color:#143b45;background:#f7faf8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #143b45;outline-offset:4px}header,main,footer{max-width:1600px;margin:auto;padding:20px 30px}header{padding-bottom:8px}h1{font-size:clamp(28px,3vw,44px);margin:0 0 8px}header p{margin:8px 0;color:#52646a;font-size:20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}.tab,.action{border:2px solid #b8c9cc;background:white;border-radius:12px;padding:12px 22px;min-height:48px;font-weight:bold}.tab[aria-pressed=true]{background:#143b45;color:white;border-color:#143b45}.action:disabled{opacity:.4;cursor:default}.actions{display:flex;gap:12px;margin-left:auto}.help{padding:13px 18px;background:#e8f0f0;border-radius:12px;font-size:18px;min-height:48px}.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.team{min-width:0;border-radius:18px;padding:4px 4px 22px;transition:background .15s}.team.drop{background:var(--pale);outline:3px dashed var(--accent)}.team h2{color:var(--accent);font-size:24px;margin:6px 0 8px;display:flex;gap:10px;align-items:center}.icon{width:30px;height:30px;fill:var(--accent);flex-shrink:0}.count{display:block;color:var(--accent);font-size:17px;font-weight:bold;margin:0 0 15px 40px}.members{display:flex;flex-direction:column;gap:20px;min-height:160px}.student{position:relative;border:1.5px solid var(--accent);border-radius:15px;background:var(--pale);color:#143b45;width:100%;padding:13px 10px;min-height:78px;user-select:none;touch-action:none;line-height:1.25;overflow-wrap:anywhere}.student::before{content:"";position:absolute;bottom:-10px;left:42px;width:23px;height:16px;background:var(--pale);border-left:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);transform:skew(-30deg) rotate(-8deg)}.surname{display:block;font-size:clamp(14px,1.35vw,21px);font-weight:700;position:relative}.first{display:block;font-size:clamp(14px,1.3vw,20px);margin-top:3px;position:relative}.student.selected{outline:4px solid var(--accent);outline-offset:4px}.student.dragging{opacity:.5}.move{width:100%;border:2px solid var(--accent);color:var(--accent);background:white;border-radius:12px;min-height:48px;font-weight:bold;margin-bottom:18px;padding:9px 6px}.move:disabled{opacity:.4;cursor:default}.team.empty .members::after{content:"Δεν υπάρχουν μέλη";padding:20px;text-align:center;color:#52646a}footer{font-size:17px;color:#52646a;padding-top:10px;padding-bottom:24px}.ghost{position:fixed;pointer-events:none;z-index:100;background:white;border:3px solid #143b45;border-radius:12px;padding:15px;max-width:280px;box-shadow:0 6px 20px #0003;font-weight:bold}.status{font-size:15px;color:#52646a;margin:10px 0 0}.dialog{border:0;border-radius:18px;padding:26px;max-width:450px;color:#143b45;box-shadow:0 10px 50px #0005}dialog::backdrop{background:#0006}.dialog p{line-height:1.5}.dialog div{display:flex;gap:12px;justify-content:flex-end}@media(max-width:900px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}.surname,.first{font-size:18px}.actions{margin-left:0}}@media(max-width:480px){header,main,footer{padding-left:14px;padding-right:14px}.teams{grid-template-columns:1fr}.toolbar{gap:8px}.tab,.action{padding:10px 14px}}@media print{.toolbar,.help,.move,.status{display:none}.teams{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.surname,.first{font-size:11pt}.student{min-height:52px;padding:8px}.members{gap:14px}header p{font-size:12pt}h1{font-size:22pt}.team h2{font-size:16pt}.student,footer{-webkit-print-color-adjust:exact;print-color-adjust:exact}footer{font-size:11pt}@page{size:A4 landscape;margin:1cm}}
</style></head><body><header><h1 id="title"></h1><p>Four teams for a year of learning together</p><div class="toolbar"><nav aria-label="Επιλογή τμήματος" id="tabs"></nav><div class="actions"><button class="action" id="undo">↶ Αναίρεση</button><button class="action" id="reset">Επαναφορά τμήματος</button><button class="action" id="print">Εκτύπωση</button></div></div><div class="help" id="help" role="status" aria-live="polite">Πάτησε ένα όνομα και μετά «Μετακίνηση εδώ» στην ομάδα που θέλεις. Μπορείς επίσης να σύρεις το όνομα.</div><p class="status" id="status"></p></header><main><div class="teams" id="teams"></div></main><footer>Evangelia Domvrou - teacher of English language and literature</footer><dialog class="dialog" id="dialog"><h2>Επαναφορά ομάδων</h2><p id="question"></p><div><button class="action" id="cancel">Ακύρωση</button><button class="action" id="confirm">Επαναφορά</button></div></dialog>
<script>
'use strict';
const INITIAL=[{"class": "Α6", "groups": [[{"surname": "ΝΙΚΟΛΑΪΔΟΥ", "first": "ΒΑΣΙΛΙΚΗ"}, {"surname": "ΠΟΡΤΟΚΑΛΗΣ", "first": "ΦΩΤΙΟΣ"}, {"surname": "ΠΟΥΝΤΑΡΟΥ", "first": "ΑΝΤΡΕΙ ΝΤΟΥΜΙΤΡΟΥ"}, {"surname": "ΡΑΝΤΑΤΣΙ", "first": "ΤΖΕΣΙΚΑ"}, {"surname": "ΠΛΙΑΚΟΣ", "first": "ΔΗΜΗΤΡΙΟΣ ΜΑΡΙΝΟΣ"}, {"surname": "ΠΙΛΙΤΣΑΚΗ", "first": "ΜΙΧΑΕΛΑ-ΜΑΡΙΑ-ΧΡΙΣΤΙΝΑ"}], [{"surname": "ΠΕΚΙΝΙ ΚΑΡΑΓΙΑΝΝΙΔΗΣ", "first": "ΚΩΝΣΤΑΝΤΙΝΟΣ"}, {"surname": "ΠΑΛΛΗΣ", "first": "ΦΡΑΓΚΙΣΚΟΣ"}, {"surname": "ΝΤΑΜΖΙ", "first": "ΜΕΣΙΝΤΙ"}, {"surname": "ΠΟΙΜΕΝΙΔΟΥ", "first": "ΑΙΚΑΤΕΡΙΝΗ"}, {"surname": "ΠΕΤΚΟΣ", "first": "ΜΕΝΕΛΑΟΣ"}, {"surname": "ΝΟΒΑΚΟΥ (NOVAKU)", "first": "ΝΙΚΟΛΑ (NIKOLA)"}], [{"surname": "ΟΙΚΟΝΟΜΟΥ", "first": "ΚΥΡΙΑΚΗ-ΑΝΝΑ"}, {"surname": "ΝΙΚΟΛΑΪΔΗΣ", "first": "ΝΙΚΗΦΟΡΟΣ"}, {"surname": "ΠΑΠΑΔΟΠΟΥΛΟΥ", "first": "ΚΩΝΣΤΑΝΤΙΝΑ"}, {"surname": "ΠΑΝΤΟΓΛΟΥ", "first": "ΦΑΙΔΩΝ"}, {"surname": "ΠΑΠΑΔΗΜΗΤΡΙΟΥ", "first": "ΧΡΙΣΤΙΝΑ"}], [{"surname": "ΠΙΤΣΟΥΛΗΣ", "first": "ΠΑΤΡΟΚΛΟΣ"}, {"surname": "ΠΑΛΛΗΣ", "first": "ΜΑΝΟΣ"}, {"surname": "ΝΤΑΜΖΙ", "first": "ΑΡΓΚΙΕΝΤ"}, {"surname": "ΠΑΠΑΔΟΠΟΥΛΟΣ", "first": "ΑΝΤΩΝΙΟΣ"}, {"surname": "ΠΟΛΥΧΡΟΝΙΔΟΥ", "first": "ΕΙΡΗΝΗ - ΝΕΦΕΛΗ"}]]}, {"class": "Α7", "groups": [[{"surname": "ΤΡΑΨΩΚΗ", "first": "ΑΝΝΑ"}, {"surname": "ΤΑΜΟΥΤΣΕΛΗΣ", "first": "ΤΡΙΑΝΤΑΦΥΛΛΟΣ"}, {"surname": "ΤΖΙΤΖΙΜΠΑΣΗΣ", "first": "ΑΝΕΣΤΗΣ-ΑΓΓΕΛΟΣ"}, {"surname": "ΤΣΑΚΑΝΙΑΣ", "first": "ΙΩΑΝΝΗΣ"}, {"surname": "ΣΙΛΜΕΣ", "first": "ΚΩΝΣΤΑΝΤΙΝΟΣ"}, {"surname": "ΤΑΤΑΡΗΣ", "first": "ΧΡΗΣΤΟΣ"}], [{"surname": "ΣΤΑΥΡΑΚΗΣ", "first": "ΠΑΥΛΟΣ-ΙΩΑΝΝΗΣ"}, {"surname": "ΣΤΡΑΝΤΖΑΛΗ", "first": "ΕΙΡΗΝΗ"}, {"surname": "ΤΣΑΟΥΣΙΔΟΥ", "first": "ΑΝΑΤΟΛΗ"}, {"surname": "ΣΙΚΟΣ", "first": "ΔΗΜΗΤΡΙΟΣ"}, {"surname": "ΣΤΟΥΠΙΑΔΗΣ", "first": "ΝΙΚΟΛΑΟΣ"}, {"surname": "ΣΚΟΥΡΤΙ", "first": "ΡΟΜΙΝΑ"}], [{"surname": "ΡΟΥΜΕΛΙΩΤΗΣ", "first": "ΘΩΜΑΣ"}, {"surname": "ΣΕΧΙ", "first": "ΑΛΕΞΗ"}, {"surname": "ΤΟΠΟΥΖΗ", "first": "ΣΟΦΙΑ"}, {"surname": "ΤΟΡΟΜΑΝΙ (TOROMANI)", "first": "ΛΕΝΤΙΑΝΑ (LEDJANA)"}, {"surname": "ΣΑΛΙΟΥ", "first": "ΑΡΜΑΝΤΟ"}], [{"surname": "ΤΙΜΠΟΛΗΣ", "first": "ΙΩΑΝΝΗΣ"}, {"surname": "ΣΤΑΜΙΔΗΣ", "first": "ΤΣΑΜΠΙΚΟΣ - ΠΑΝΟΡΜΙΤΗΣ"}, {"surname": "ΤΑΓΓΟΠΟΥΛΟΣ", "first": "ΑΛΕΞΑΝΔΡΟΣ"}, {"surname": "ΤΣΑΚΙΡΗ", "first": "ΒΑΣΙΛΕΙΑ-ΠΕΛΑΓΙΑ"}, {"surname": "ΤΖΩΤΖΗΣ", "first": "ΑΧΙΛΛΕΑΣ"}]]}, {"class": "Α8", "groups": [[{"surname": "ΤΣΕΚΡΕΖΙ", "first": "ΑΛΕΞΑΝΤΡΑ"}, {"surname": "ΦΩΤΙΑΔΗΣ", "first": "ΟΔΥΣΣΕΑΣ"}, {"surname": "ΤΣΟΛΑΚΙΔΗΣ", "first": "ΘΑΛΗΣ ΔΗΜΗΤΡΙΟΣ"}, {"surname": "ΤΣΙΚΜΑΣ", "first": "ΝΙΚΟΛΑΟΣ"}, {"surname": "ΧΡΙΠΑΤΣΙΟΣ", "first": "ΑΓΓΕΛΟΣ"}], [{"surname": "ΦΕΡΤΙ", "first": "ΡΕΪ"}, {"surname": "ΧΑΤΖΗΝΙΚΟΛΑΟΥ", "first": "ΒΑΣΙΛΕΙΟΣ"}, {"surname": "ΧΡΙΣΤΟΔΟΥΛΙΔΗΣ", "first": "ΠΑΥΛΟΣ"}, {"surname": "ΧΑΝΔΡΟΣ", "first": "ΑΝΑΣΤΑΣΙΟΣ"}, {"surname": "ΤΣΟΜΠΑΝΗΣ", "first": "ΑΔΑΜ"}, {"surname": "ΤΣΟΜΤΣΟΣ", "first": "ΝΙΚΟΛΑΟΣ"}], [{"surname": "ΤΣΕΠΕΛΗΣ", "first": "ΑΝΤΩΝΙΟΣ"}, {"surname": "ΧΑΝΤ", "first": "ΣΑΡΡΑ"}, {"surname": "ΧΑΤΖΑΚΟΣ", "first": "ΧΡΗΣΤΟΣ"}, {"surname": "ΦΩΤΙΑΔΗΣ", "first": "ΒΑΣΙΛΕΙΟΣ"}, {"surname": "ΨΗΛΟΓΕΩΡΓΗΣ", "first": "ΝΙΚΟΛΑΟΣ"}], [{"surname": "ΨΑΛΤΟΠΟΥΛΟΣ", "first": "ΙΑΣΩΝ - ΓΕΩΡΓΙΟΣ"}, {"surname": "ΤΣΑΡΟΥΧΑ", "first": "ΑΝΝΑ - ΜΑΡΙΑ"}, {"surname": "ΦΕΣΛΙΟΓΛΟΥ", "first": "ΜΑΡΙΑ"}, {"surname": "ΧΑΜΑΪΔΟΣ", "first": "ΓΕΩΡΓΙΟΣ"}, {"surname": "ΧΑΤΖΗΟΥΖΟΥΝΗΣ", "first": "ΑΝΤΩΝΙΟΣ"}, {"surname": "ΤΣΑΧΙΔΟΥ", "first": "ΕΛΕΝΗ"}]]}];
const KEY='domvrou-class-teams-v1';
const clone=x=>JSON.parse(JSON.stringify(x));
const catalog=INITIAL.flatMap(c=>c.groups.flat()).map((x,i)=>({...x,id:'s'+i}));
let offset=0;const original=INITIAL.map(c=>({class:c.class,groups:c.groups.map(g=>g.map(()=>catalog[offset++].id))}));
let state=clone(original),active=0,selected=null;let histories=original.map(()=>[]),storageWorks=true;
function valid(v){return Array.isArray(v)&&v.length===3&&v.every((c,i)=>c.class===original[i].class&&Array.isArray(c.groups)&&c.groups.length===4&&c.groups.every(Array.isArray)&&c.groups.flat().length===22&&new Set(c.groups.flat()).size===22&&c.groups.flat().every(id=>original[i].groups.flat().includes(id)))}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state=saved}catch(e){storageWorks=false}
const colors=['#167d8d','#7750a5','#b5691f','#38794b'],fills=['#e3f4f5','#efe8f9','#fff0da','#e8f4e7'];
const paths=['M15 1 19 10 29 11 21 18 23 29 15 23 7 29 9 18 1 11 11 10Z','M15 5A10 10 0 1 0 15 25A10 10 0 1 0 15 5M14 0H16V3H14ZM14 27H16V30H14ZM0 14H3V16H0ZM27 14H30V16H27Z','M15 27C-8 12 4-4 15 7C26-4 38 12 15 27Z','M8 1H21L16 12H26L10 29L14 17H5Z'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageWorks=true}catch(e){storageWorks=false}document.querySelector('#status').textContent=storageWorks?'Οι αλλαγές αποθηκεύονται αυτόματα σε αυτόν τον browser και σε αυτή τη συσκευή.':'Η αποθήκευση δεν είναι διαθέσιμη. Οι αλλαγές ισχύουν όσο μένει ανοιχτή η σελίδα.'}
function name(id){const s=catalog.find(x=>x.id===id);return s.surname+' '+s.first}
function render(){const c=state[active];document.querySelector('#title').textContent=c.class+'  Our teams';const tabs=document.querySelector('#tabs');tabs.replaceChildren();state.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=c.class;b.style.marginRight='8px';b.setAttribute('aria-pressed',i===active);b.onclick=()=>{active=i;selected=null;render()};tabs.append(b)});
const host=document.querySelector('#teams');host.replaceChildren();c.groups.forEach((g,i)=>{const team=document.createElement('section');team.className='team'+(g.length?'':' empty');team.dataset.group=i;team.style.setProperty('--accent',colors[i]);team.style.setProperty('--pale',fills[i]);team.innerHTML='<h2><svg class="icon" viewBox="0 0 30 30" aria-hidden="true"><path d="'+paths[i]+'"/></svg>Team '+(i+1)+'</h2><span class="count">'+g.length+' members</span>';
const move=document.createElement('button');move.className='move';move.textContent='Μετακίνηση εδώ';move.disabled=!selected||g.includes(selected);move.onclick=()=>moveStudent(selected,i);team.append(move);const members=document.createElement('div');members.className='members';g.forEach(id=>{const student=catalog.find(x=>x.id===id),b=document.createElement('button');b.className='student'+(id===selected?' selected':'');b.dataset.student=id;b.setAttribute('aria-pressed',id===selected);b.setAttribute('aria-label',name(id)+', ομάδα '+(i+1));const sn=document.createElement('span');sn.className='surname';sn.textContent=student.surname;const fn=document.createElement('span');fn.className='first';fn.textContent=student.first;b.append(sn,fn);b.onclick=()=>{if(suppressClick)return;selected=selected===id?null:id;render()};b.addEventListener('pointerdown',pointerStart);members.append(b)});team.append(members);host.append(team)});
document.querySelector('#undo').disabled=!histories[active].length;document.querySelector('#help').textContent=selected?'Επιλεγμένο: '+name(selected)+'. Πάτησε «Μετακίνηση εδώ» στην ομάδα προορισμού.':'Πάτησε ένα όνομα και μετά «Μετακίνηση εδώ» στην ομάδα που θέλεις. Μπορείς επίσης να σύρεις το όνομα.';save()}
function moveStudent(id,to){if(!id)return;const from=state[active].groups.findIndex(g=>g.includes(id));if(from<0||from===to)return;histories[active].push(clone(state[active]));state[active].groups[from]=state[active].groups[from].filter(x=>x!==id);state[active].groups[to].push(id);selected=null;render()}
let drag=null,suppressClick=false;
function pointerStart(e){if(e.button!==0)return;drag={id:e.currentTarget.dataset.student,x:e.clientX,y:e.clientY,pointer:e.pointerId,source:e.currentTarget,moving:false,ghost:null};e.currentTarget.setPointerCapture(e.pointerId)}
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;if(!drag.moving&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>12){drag.moving=true;drag.source.classList.add('dragging');drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.textContent=name(drag.id);document.body.append(drag.ghost)}if(!drag.moving)return;e.preventDefault();drag.ghost.style.left=e.clientX+15+'px';drag.ghost.style.top=e.clientY+15+'px';document.querySelectorAll('.team').forEach(t=>t.classList.remove('drop'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.team');if(target)target.classList.add('drop')},{passive:false});
function finish(e,cancel=false){if(!drag||e.pointerId!==drag.pointer)return;const d=drag;drag=null;if(d.moving){suppressClick=true;setTimeout(()=>suppressClick=false,200);const t=cancel?null:document.elementFromPoint(e.clientX,e.clientY)?.closest('.team');d.ghost?.remove();d.source.classList.remove('dragging');document.querySelectorAll('.team').forEach(t=>t.classList.remove('drop'));if(t)moveStudent(d.id,Number(t.dataset.group))}}
document.addEventListener('pointerup',e=>finish(e));document.addEventListener('pointercancel',e=>finish(e,true));
document.querySelector('#undo').onclick=()=>{if(histories[active].length){state[active]=histories[active].pop();selected=null;render()}};
const dialog=document.querySelector('#dialog');document.querySelector('#reset').onclick=()=>{document.querySelector('#question').textContent='Να επανέλθει το '+state[active].class+' στην αρχική κατανομή; Τα άλλα τμήματα θα κρατήσουν την κατανομή τους.';dialog.showModal()};document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#confirm').onclick=()=>{histories[active].push(clone(state[active]));state[active]=clone(original[active]);selected=null;dialog.close();render()};document.querySelector('#print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;render()}});render();
</script></body></html>
