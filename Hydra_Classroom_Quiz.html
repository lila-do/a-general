e-space:pre-wrap;font-size:22px;line-height:1.65}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:20px;background:#eef5f4;border-radius:12px;font-size:20px}.stat strong{display:block;font-size:36px}.review{border-bottom:1px solid #ccdeda;padding:15px 0;font-size:18px;line-height:1.5}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:0 12px}.summary{grid-template-columns:1fr}.tools button{padding:10px}p{font-size:20px}}@media print{header,.tools,.nav,footer{display:none}main{max-width:none}.card{box-shadow:none}body{background:white}}</style>

1, "why": "The text specifies food supplies in the Mediterranean Sea."}, {"section": "Comprehension", "type": "mc", "q": "What does the text say about Hydra and the start of the Revolution?", "opts": ["Hydra started it alone", "Hydra never joined it", "Hydriots were not the first to start it"], "a": 2, "why": "They joined the Greek War of Independence after others had started it."}, {"section": "Comprehension", "type": "mc", "q": "What proportion of the Greek fleet came from Hydra?", "opts": ["Two-thirds", "One-quarter", "The whole fleet"], "a": 0, "why": "Hydriot ships made up two-thirds of the whole Greek fleet."}, {"section": "Comprehension", "type": "mc", "q": "What else did Hydra contribute to the Revolution?", "opts": ["Only money", "Its men", "Only food"], "a": 1, "why": "The passage says Hydra also offered its men."}, {"section": "Comprehension", "type": "mc", "q": "What was Andreas Miaoulis’ role?", "opts": ["Museum director", "Prime Minister", "Commander of the Greek fleet"], "a": 2, "why": "Miaoulis became the famous commander of the Greek fleet."}, {"section": "Comprehension", "type": "mc", "q": "According to the passage, who was Prime Minister from 1822 to 1827?", "opts": ["Georgios Koundouriotis", "Andreas Miaoulis", "One of the project authors"], "a": 0, "why": "The passage gives this name and date range; answer according to the reading."}, {"section": "Comprehension", "type": "mc", "q": "Which objects can visitors see in the Museum of Hydra?", "opts": ["Modern aircraft", "Figureheads and paintings of Revolution ships", "Roman racing cars"], "a": 1, "why": "These are among the objects listed in the museum paragraph."}, {"section": "Comprehension", "type": "mc", "q": "How is Miaoulis remembered at the Miaoulia festival?", "opts": ["His ships are rebuilt", "The museum closes", "An Air Force plane drops a wreath into the sea"], "a": 2, "why": "The festival takes place around June 20 and includes this tribute."}, {"section": "Vocabulary", "type": "mc", "q": "“Plenty of water” means…", "opts": ["very little water", "a lot of water", "no water"], "a": 1, "why": "“Plenty of” means a large amount of something."}, {"section": "Vocabulary", "type": "mc", "q": "“Make a living” means…", "opts": ["earn enough money to live", "build a house", "travel abroad"], "a": 0, "why": "It means earning money for your everyday needs."}, {"section": "Vocabulary", "type": "mc", "q": "“Canny” describes someone who is…", "opts": ["careless", "unlucky", "clever and practical"], "a": 2, "why": "The Hydriots were clever and practical in developing their fleet."}, {"section": "Vocabulary", "type": "mc", "q": "“Infertile” land is land that…", "opts": ["produces many crops", "cannot grow crops well", "is covered by houses"], "a": 1, "why": "Infertile land is not productive for agriculture."}, {"section": "Vocabulary", "type": "mc", "q": "“Autonomous status” means…", "opts": ["a degree of self-government", "complete poverty", "having no inhabitants"], "a": 0, "why": "Autonomous means able to govern itself to a degree."}, {"section": "Vocabulary", "type": "mc", "q": "A “monopoly” is…", "opts": ["a public festival", "a kind of painting", "exclusive control of a trade or supply"], "a": 2, "why": "It means one supplier or group controls that trade or supply."}, {"section": "Vocabulary", "type": "mc", "q": "“Exhibited” means…", "opts": ["hidden away", "displayed for people to see", "destroyed"], "a": 1, "why": "Museum objects are exhibited: put on public display."}, {"section": "Vocabulary", "type": "mc", "q": "“In memory of” means…", "opts": ["to honour and remember", "to compete against", "to ask permission from"], "a": 0, "why": "The wreath honours and remembers Miaoulis."}, {"section": "Vocabulary", "type": "gap", "q": "Hydra’s land could not support ______ (growing crops and farming).", "a": "agriculture", "why": "Agriculture means farming or growing crops."}, {"section": "Vocabulary", "type": "gap", "q": "A group of ships is called a ______.", "a": "fleet", "why": "A fleet is a group of ships."}, {"section": "Vocabulary", "type": "gap", "q": "A person who buys and sells goods is a ______.", "a": "merchant", "why": "A merchant trades goods."}, {"section": "Vocabulary", "type": "gap", "q": "A power connected with ships and the sea is a ______ power.", "a": "maritime", "why": "Maritime means connected with the sea and shipping."}, {"section": "Vocabulary", "type": "gap", "q": "Food and other necessary goods are called ______.", "a": "supplies", "why": "Supplies are goods that people need."}, {"section": "Vocabulary", "type": "gap", "q": "The Greeks fought for ______ (freedom from another country’s rule).", "a": "independence", "why": "Independence means freedom from external rule."}, {"section": "Vocabulary", "type": "match", "q": "Match the word to its meaning: port", "opts": ["a decorative figure on the front of a ship", "a ring of flowers or leaves used as a tribute", "a place where ships load, unload, and shelter", "took control of by force", "a person who leads a military force", "made a place their home"], "a": 2, "why": "Port: a place where ships load, unload, and shelter."}, {"section": "Vocabulary", "type": "match", "q": "Match the word to its meaning: settled", "opts": ["a decorative figure on the front of a ship", "a ring of flowers or leaves used as a tribute", "a place where ships load, unload, and shelter", "took control of by force", "a person who leads a military force", "made a place their home"], "a": 5, "why": "Settled: made a place their home."}, {"section": "Vocabulary", "type": "match", "q": "Match the word to its meaning: captured", "opts": ["a decorative figure on the front of a ship", "a ring of flowers or leaves used as a tribute", "a place where ships load, unload, and shelter", "took control of by force", "a person who leads a military force", "made a place their home"], "a": 3, "why": "Captured: took control of by force."}, {"section": "Vocabulary", "type": "match", "q": "Match the word to its meaning: commander", "opts": ["a decorative figure on the front of a ship", "a ring of flowers or leaves used as a tribute", "a place where ships load, unload, and shelter", "took control of by force", "a person who leads a military force", "made a place their home"], "a": 4, "why": "Commander: a person who leads a military force."}, {"section": "Vocabulary", "type": "match", "q": "Match the word to its meaning: figurehead", "opts": ["a decorative figure on the front of a ship", "a ring of flowers or leaves used as a tribute", "a place where ships load, unload, and shelter", "took control of by force", "a person who leads a military force", "made a place their home"], "a": 0, "why": "Figurehead: a decorative figure on the front of a ship."}, {"section": "Vocabulary", "type": "match", "q": "Match the word to its meaning: wreath", "opts": ["a decorative figure on the front of a ship", "a ring of flowers or leaves used as a tribute", "a place where ships load, unload, and shelter", "took control of by force", "a person who leads a military force", "made a place their home"], "a": 1, "why": "Wreath: a ring of flowers or leaves used as a tribute."}];const source="Our Hydra Project\nby Stelios, Martha, Aspasia, Sotiris, Lakis\n\nHydra is one of the islands of the Argosaronic Gulf, a small distance from the port of Piraeus. It is said that once Hydra was covered with forests. The name, Hydra, means a place with plenty of water, but today it is grey and rocky.\n\nSince agriculture was impossible, the island could not offer much to make a living. As a result, the people who first settled on the island started building ships. For the same reason, when the Turks captured Hydra in 1715, they ignored this infertile island. The canny Hydriots then built up an important fleet of ships, which developed into a merchant marine power. By the 19th century Hydra was rich, a great maritime power and had been allowed to acquire autonomous status. Its ships had the monopoly of food supplies in the Mediterranean Sea.\n\nHydriots were not the first to start the Greek War of Independence against the Turks in 1821. When they joined, however, their ships made up two-thirds of the whole Greek fleet. More than that, Hydra offered its men to the Revolution. Admiral Andreas Miaoulis became the famous commander of the Greek fleet, while Georgios Koundouriotis was the first Prime Minister of the newly born Greek State from 1822 to 1827.\n\nIf you go to Hydra, you must visit the Museum of Hydra. Hydrian costumes, memories from the War of Independence, art objects of the 18th and 19th century, figureheads and paintings of the ships of the 1821 Greek Revolution are exhibited there.\n\nEvery year around June 20, a big festival is organised in Hydra called Miaoulia. A plane of the Greek Air Force drops a wreath into the sea in memory of the hero Andreas Miaoulis. It is good to communicate with history and remember that Miaoulis’ cross, and more importantly, his heart, the heart of Greece, is ‘alive’ in the Hall of Paintings of the Museum of Hydra even today.";const app=document.querySelector('#app');const key='hydra-quiz-v2';let state={started:false,index:0,answers:{},done:false};try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.answers&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<35)state=saved}catch(e){}let choice=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function reset(){if(confirm('Start a new quiz? This clears the current answers and score.')){state={started:false,index:0,answers:{},done:false};save();render()}}function score(section){return questions.reduce((n,q,i)=>n+((!section||q.section===section)&&state.answers[i]?.correct?1:0),0)}function render(){choice=null;if(!state.started){app.innerHTML=`<div class="card"><div class="eyebrow">Classroom challenge</div><h2>A small island. A powerful story.</h2><p>Explore Hydra’s landscape, ships, history, and museum.</p><div class="summary"><div class="stat"><strong>15</strong>Comprehension questions</div><div class="stat"><strong>20</strong>Vocabulary items</div><div class="stat"><strong>35</strong>Total points</div></div><p>Choose an answer, fill a gap, or match a word to its meaning. Multiple-choice and matching answers are checked automatically when selected. Gap answers are checked when you leave the field, press Enter, or tap Next. Read the feedback, then continue. Each item earns one point on your first checked answer.</p><p>For gap filling, use a word from the text. Matching is completed one word at a time. You may open the reading at any time.</p><button class="primary" id="start">Start quiz</button></div>`;document.querySelector('#start').onclick=()=>{state.started=true;save();render()};return}if(state.done){results();return}const i=state.index,q=questions[i],ans=state.answers[i];app.innerHTML=`<div class="card"><div class="meta"><span>${q.section} • ${q.type==='mc'?'Multiple choice':q.type==='gap'?'Fill the gap':'Matching'}</span><span>Question ${i+1} / 35</span></div><progress value="${Object.keys(state.answers).length}" max="35"></progress><h2>${esc(q.q)}</h2><div id="response">${q.type==='gap'?'<label for="gap">Type the missing word</label><input id="gap" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Your answer">':q.type==='match'?'<label for="match">Choose the matching meaning</label><select id="match"><option value="">Select a meaning…</option>'+q.opts.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')+'</select>':'<div class="options">'+q.opts.map((o,j)=>`<button class="option" data-choice="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')+'</div>'}</div><div id="feedback" aria-live="polite" hidden></div><div class="nav"><button id="prev" ${i===0?'disabled':''}>← Previous</button><button class="primary" id="next" ${!ans&&q.type!=='gap'?'disabled':''}>${i===34?'See results':'Next →'}</button></div><div class="nav"><span>Score: ${score()} / ${Object.keys(state.answers).length} answered</span><button id="reset">Restart</button></div></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));check()});document.querySelector('#prev').onclick=()=>{state.index--;save();render()};document.querySelector('#next').onclick=()=>{if(!state.answers[i]){check();return}if(i===34)state.done=true;else state.index++;save();render()};document.querySelector('#reset').onclick=reset;if(q.type==='gap'){document.querySelector('#gap').onkeydown=e=>{if(e.key==='Enter'&&!state.answers[i])check()};document.querySelector('#gap').onchange=()=>{if(!state.answers[i]&&document.querySelector('#gap').value.trim())check()}}if(q.type==='match')document.querySelector('#match').onchange=check;if(ans)showAnswer(ans)}function check(){const q=questions[state.index];let value=q.type==='gap'?document.querySelector('#gap').value.trim():q.type==='match'?document.querySelector('#match').value:choice;if(value===null||value===''){const f=document.querySelector('#feedback');f.hidden=false;f.textContent='Please enter or choose an answer first.';return}if(q.type!=='gap')value=Number(value);const correct=q.type==='gap'?value.toLowerCase().replace(/[.!?]+$/,'')===q.a:value===q.a;state.answers[state.index]={value,correct};save();showAnswer(state.answers[state.index])}function showAnswer(ans){const q=questions[state.index];document.querySelector('#next').disabled=false;document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;const j=Number(b.dataset.choice);b.classList.toggle('correct',j===q.a);b.classList.toggle('wrong',j===ans.value&&!ans.correct)});if(q.type==='gap'){document.querySelector('#gap').value=ans.value;document.querySelector('#gap').disabled=true}if(q.type==='match'){document.querySelector('#match').value=ans.value;document.querySelector('#match').disabled=true}const f=document.querySelector('#feedback');f.hidden=false;f.innerHTML=`<b>${ans.correct?'Correct! +1 point':'Not quite. No point this time.'}</b><br>${esc(q.why)}`;document.querySelector('.nav + .nav span').textContent=`Score: ${score()} / ${Object.keys(state.answers).length} answered`}function results(){const s=score();app.innerHTML=`<div class="card"><div class="eyebrow">Quiz complete</div><h2>${s>=28?'Excellent work!':s>=21?'Good effort!':'Keep exploring Hydra!'}</h2><div class="summary"><div class="stat"><strong>${s}/35</strong>${Math.round(s/35*100)}% total score</div><div class="stat"><strong>${score('Comprehension')}/15</strong>Comprehension</div><div class="stat"><strong>${score('Vocabulary')}/20</strong>Vocabulary</div></div><div class="nav"><button id="review">Show answer review</button><button onclick="window.print()">Print results</button><button id="reset">New quiz</button></div><div id="reviewList" hidden>${questions.map((q,i)=>{let a=state.answers[i];let given=a?(q.type==='gap'?a.value:q.opts[a.value]):'Unanswered';return `<div class="review"><b>${i+1}. ${esc(q.q)}</b><br>${a?.correct?'✓':'✗'} Your answer: ${esc(given)}<br>Correct answer: ${esc(q.type==='gap'?q.a:q.opts[q.a])}<br>${esc(q.why)}</div>`}).join('')}</div></div>`;document.querySelector('#reset').onclick=reset;document.querySelector('#review').onclick=()=>{let r=document.querySelector('#reviewList');r.hidden=!r.hidden;document.querySelector('#review').textContent=r.hidden?'Show answer review':'Hide answer review'}}document.querySelector('#reading').textContent=source;document.querySelector('#read').onclick=()=>document.querySelector('#textDialog').showModal();document.querySelector('#closeText').onclick=()=>document.querySelector('#textDialog').close();document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Use your browser’s full-screen command for a larger view.')}};render();
</script></html>
