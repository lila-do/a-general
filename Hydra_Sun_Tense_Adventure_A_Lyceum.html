m.message.text)}</span></div>`:''}</div>`}
  function renderSupport(){const ix=state.supportIndex;if(ix>=supportQuestions.length)return `${slideIntro('Mission 3 completed','Μπράβο! You did it! 🌟','Ten bilingual questions completed. The Greek clues helped you build English grammar confidence.')}<div class="mini-banner">🇬🇷 <span>Great learners check their mistakes, ask for help and try again. Αυτό ακριβώς έκανες!</span></div><div style="margin-top:25px"><button class="cta" data-action="goto" data-slide="9">See my results →</button></div>`;const q=supportQuestions[ix],ans=state.support[ix]||{tries:0,solved:false},isWrong=ans.tries>0&&!ans.solved;return `${slideIntro('Mission 3 / English + Ελληνικά','The confidence bridge.','Read both languages. Find the time clue. You can reveal a Greek hint before answering.')}<div class="support-shell"><div class="q-card"><div class="game-header"><span class="topic-badge">🤝 Gentle practice</span><span class="counter">${ix+1} / ${supportQuestions.length}</span></div><div class="question">${escapeHTML(q.q).replace('___','<span class="blank">?</span>')}</div><div class="greek-block"><div class="label">🇬🇷 Στα ελληνικά</div><p>${escapeHTML(q.gr)}</p></div><div class="choices">${q.opts.map((opt,i)=>`<button class="choice ${ans.solved&&i===q.correct?'correct':''} ${isWrong&&ans.last===i?'wrong':''}" data-action="support-answer" data-choice="${i}" ${ans.solved?'disabled':''}><span class="letter">${i+1}</span><span>${escapeHTML(opt)}</span>${ans.solved&&i===q.correct?' ✅':''}</button>`).join('')}</div><div style="margin-top:16px"><button class="hint-button" data-action="hint" ${state.hints[ix]?'disabled':''}>${state.hints[ix]?'💡 Βοήθεια εμφανίστηκε':'💡 Χρειάζομαι βοήθεια'}</button>${state.hints[ix]?`<div class="hint-text">${escapeHTML(q.hint)}</div>`:''}</div>${ans.tries?`<div class="feedback ${ans.solved?'':'wrong'}" role="status"><span class="feedback-emoji">${ans.solved?'👏':'🤝'}</span><span><strong>${ans.solved?'Σωστά! Well done!':'Δοκίμασε ξανά! Try again!'}</strong>${ans.solved?escapeHTML(q.why):'Βρες τη χρονική λέξη-κλειδί και σκέψου τον χρόνο.'}</span></div>`:''}<div class="question-footer"><span class="micro">${ans.solved?'✓ Completed · Ολοκληρώθηκε':'There is no time limit · Χωρίς χρονόμετρο'}</span>${ans.solved?`<button class="next-q" data-action="support-next">${ix===supportQuestions.length-1?'Finish':'Next · Επόμενο →'}</button>`:''}</div></div><aside class="vocab"><div style="font-size:43px">🇬🇷 🤝 🇬🇧</div><h3>Helpful words</h3><dl><dt>every year</dt><dd>κάθε χρόνο</dd><dt>yesterday</dt><dd>χθες</dd><dt>right now</dt><dd>αυτή τη στιγμή</dd><dt>while</dt><dd>ενώ</dd><dt>tomorrow</dt><dd>αύριο</dd><dt>in 1821</dt><dd>το 1821</dd></dl><div class="support-help">🌱 Learning tip: It is okay to use your first language to understand a new grammar pattern.</div></aside></div>`}
  function renderResults(){const count=solvedCount(),pct=Math.round(count/TOTAL*100),completed=count===TOTAL;return `<div class="finish-center"><div class="eyebrow"><i class="dot"></i>Mission report</div><div class="trophy">${completed?'🏆':'🧭'}</div><h2>${completed?'You are a tense traveller!':'Look how far you have travelled!'}</h2><p class="lead" style="margin-left:auto;margin-right:auto">${completed?'You completed every grammar challenge inspired by Hydra and the sun. Congratulations!':'You can return to any unfinished game. Your progress is saved automatically in this browser.'}</p><div class="stats"><div class="stat"><strong>${count}<span style="font-size:22px">/${TOTAL}</span></strong><span>Questions / pairs solved</span></div><div class="stat"><strong>⭐ ${state.stars}</strong><span>First-try stars</span></div><div class="stat"><strong>${pct}%</strong><span>Mission completion</span></div></div><p class="subtle">Longest first-try streak: <strong>${state.bestStreak}</strong> ${state.bestStreak===1?'answer':'answers'} in a row.</p><div class="finish-actions"><button class="cta" data-action="goto" data-slide="4">🎯 Revisit the games</button><button class="cta secondary" data-action="reset">↺ Start again</button></div><p class="note">Based on the two class reading passages about Hydra and sun exposure. These grammar examples are educational; the original sun passage’s old SPF examples and suggestion of completely risk-free tanning should not be treated as current health advice.</p></div>`}
  function render(){const content=[renderWelcome,renderMission,renderTenses,renderClues,()=>renderQuiz('hydra'),()=>renderQuiz('sun'),()=>renderMatching('hydra'),()=>renderMatching('sun'),renderSupport,renderResults][state.slide]();$('stage').innerHTML=content;$('score-pill').textContent=`⭐ ${state.stars} stars · ${solvedCount()}/${TOTAL}`;$('page-meta').textContent=`${String(state.slide+1).padStart(2,'0')} / ${slideNames.length}`;$('deck-progress').style.width=`${(state.slide+1)/slideNames.length*100}%`;$('prev').disabled=state.slide===0;$('next').disabled=state.slide===slideNames.length-1;const speaker=$('sound-toggle');speaker.setAttribute('aria-pressed',String(state.soundOn));speaker.setAttribute('aria-label',state.soundOn?'Turn sound off':'Turn sound on');speaker.querySelector('.sound-icon').textContent=state.soundOn?'🔊':'🔇';speaker.querySelector('.sound-label').textContent=state.soundOn?'Sound on':'Sound off';save();}
  function goto(n){state.slide=Math.max(0,Math.min(slideNames.length-1,n));render();window.scrollTo({top:0,behavior:'instant'})}
  function answerMCQ(topic,choice){const idx=state.quizIndex[topic],q=quizSets[topic][idx],id=topic+idx,a=state.quiz[id]||{tries:0,solved:false};if(a.solved)return;const first=a.tries===0;a.tries++;a.last=choice;if(choice===q.correct){a.solved=true;award(first)}else state.streak=0;state.quiz[id]=a;render();playFeedback(a.solved);announce(a.solved?`You did it! ${q.why}`:'Try again. Look at the time clue.')}
  function answerSupport(choice){const idx=state.supportIndex,q=supportQuestions[idx],a=state.support[idx]||{tries:0,solved:false};if(a.solved)return;const first=a.tries===0;a.tries++;a.last=choice;if(choice===q.correct){a.solved=true;award(first)}else state.streak=0;state.support[idx]=a;render();playFeedback(a.solved);announce(a.solved?`You did it! ${q.why}`:'Try again. Δοκίμασε ξανά.')}
  function matchLeft(topic,idx){const m=state.match[topic];if(m.solved[idx])return;m.selected=idx;m.message=null;render()}
  function matchRight(topic,idx){const m=state.match[topic];if(m.solved[idx])return;if(m.selected===null){m.message={ok:false,text:'Choose a sentence from the left column first.'};render();return}const chosen=m.selected;const correct=chosen===idx;if(correct){m.solved[chosen]=true;award(!m.misses[chosen]);m.message={ok:true,text:matchingSets[topic][chosen].why};m.selected=null;announce('You did it! '+m.message.text)}else{m.misses[chosen]=(m.misses[chosen]||0)+1;state.streak=0;m.message={ok:false,text:'Look at the time clue in the selected sentence, then choose another verb form.'};announce('Try again. Choose a different verb form.')}render();playFeedback(correct)}
  function announce(s){const live=$('live');live.textContent='';setTimeout(()=>{live.textContent=s},30)}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case'prev':goto(state.slide-1);break;case'next':goto(state.slide+1);break;case'goto':goto(Number(b.dataset.slide));break;case'mcq':answerMCQ(b.dataset.topic,Number(b.dataset.choice));break;case'next-mcq':state.quizIndex[b.dataset.topic]++;render();break;case'match-left':matchLeft(b.dataset.topic,Number(b.dataset.index));break;case'match-right':matchRight(b.dataset.topic,Number(b.dataset.index));break;case'support-answer':answerSupport(Number(b.dataset.choice));break;case'support-next':state.supportIndex++;render();break;case'hint':state.hints[state.supportIndex]=true;render();break;case'toggle-sound':state.soundOn=!state.soundOn;if(!state.soundOn){clearTimeout(speechTimer);if('speechSynthesis'in window)window.speechSynthesis.cancel()}render();break;case'reset':if(confirm('Start again? This will erase your saved answers and stars.')){state=fresh();save();goto(0)}break;case'fullscreen':if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.();break;}});
  document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!(e.ctrlKey||e.metaKey)){e.preventDefault();goto(state.slide+1)}if(e.key==='ArrowLeft'&&!(e.ctrlKey||e.metaKey)){e.preventDefault();goto(state.slide-1)}});
  render();
  </script>
